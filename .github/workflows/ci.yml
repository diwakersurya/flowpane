name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate .
      - run: claude plugin test .

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: zip -r flowpane-${GITHUB_REF_NAME}.zip .claude-plugin hooks types LICENSE README.md -x '.claude-plugin/types/*'
      - run: gh release create "$GITHUB_REF_NAME" flowpane-${GITHUB_REF_NAME}.zip --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
